<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 模型展示區</title>
  
  <!-- 載入 Google model-viewer 組件 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
    .info-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 16px;
      border-radius: 8px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div class="info-overlay">
    <h3 id="title-text">載入中...</h3>
  </div>

  <!-- 3D 展示元件 -->
  <model-viewer 
    id="viewer" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1" 
    ar>
  </model-viewer>

  <script>
    // 1. 取得網址中第一個問號後面的數字 (例如: ?1 -> "1", ?10 -> "10")
    const searchString = window.location.search.substring(1);

    // 2. 驗證是否為純數字，若沒有輸入或格式不對，預設顯示 1
    const id = /^\d+$/.test(searchString) ? searchString : '1';

    // 3. 組成檔案名稱
    const fileName = `${id}.glb`;

    // 4. 設定 model-viewer 的來源與畫面標題
    const viewer = document.getElementById('viewer');
    const titleText = document.getElementById('title-text');

    viewer.src = fileName;
    titleText.textContent = `目前展示：${fileName}`;
  </script>

</body>
</html>
